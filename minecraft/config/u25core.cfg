# Configuration file

general {
    # Add the DefenseTech Thermobaric/Nuclear Explosion sound to IC2 Nuke Explosions. Requires both mods to be active. [default: true]
    B:addDefenseTechExplosionSoundToIC2Nuke=true

    # Catch rare crashes due to a missing blockrenderer if inside of that block. Seems to be caused by chromaticraft. [default: false]
    B:catchInsideOfBlockCrash=true

    # Prevents a light & mood update (World.func_147467_a) if the provided chunk parameter (p_147467_3_) is null.  [default: true]
    B:enableLightAndMoodUpdateCrashPrevention=true

    # Toggle some unused features in EnderIO if present, such as Gas Conduits, make item conduits more useful. [default: true]
    B:enderIOTweaks=true

    # Add StructureLib support for other mods multiblocks so they show up in NEI & ingame with the projector. [default: true]
    B:externalStructureLibMultiblocks=true

    # Optional prefix to use with the Git Revision property. [default: ]
    S:gitRevPrefix=

    # Nerf the ChromatiCraft Enhanced Potion Pendants. [default: true]
    B:nerfCCEnhancedPendants=true

    # Add a cast cost to the ChromatiCraft handheld guns. [default: true]
    B:nerfCCGuns=true

    # Prevent Item Frames from ticking in unloaded chunks when AM2 is installed. [default: true]
    B:preventAM2ItemFrameChunkloading=true

    # Increase the rarity of RTG Volcanoes, on top of the seemingly broken config rarity. [default: true]
    B:rtgIncreaseVolcanoRarity=true

    # Modify RTG World Gen to be more noisy and raggy in mountainous terrain. [default: true]
    B:rtgMountainousTerrainRougher=true

    # Set the Git Revision property on startup for showing with modernsplash. [default: true]
    B:setGitRev=true
}


